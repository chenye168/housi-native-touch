name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 说明：本项目目标平台是 macOS 27。GitHub 托管的 macOS runner 尚未提供对应 SDK，
# 因此 CI 只验证「不依赖新 SDK」的部分（C / ObjC / shell 脚本 / 隐私检查）。
# 完整构建（含 Swift 探针）请在本机执行 `make build`。

jobs:
  build:
    name: 编译检查（C / ObjC）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          clang --version | head -1

      - name: 构建 daemon（C + IOKit）
        run: ./tools/daemon/build.sh

      - name: 构建辅助 App（C + IOHIDManager）
        run: ./tools/helper/build.sh

      - name: 构建 harness HID 探针（C）
        run: |
          mkdir -p tools/harness/build
          clang -O2 -Wall -o tools/harness/build/hidprobe tools/harness/hidprobe.c \
            -framework IOKit -framework CoreFoundation

      - name: 构建独立 C 探针
        run: |
          for t in dscx fastpath ffcheck hidmode_root hidprop hidprop2 regmark regset svcmode; do
            clang -O2 -Wall -o "tools/$t" "tools/$t.c" \
              -framework IOKit -framework CoreFoundation -framework Foundation
            echo "built: $t"
          done

      - name: 冒烟测试（--help 不触碰设备）
        run: |
          ./tools/harness/build/hidprobe --help > /dev/null
          ./tools/ffcheck > /dev/null || true

      - name: shell 脚本语法检查
        run: |
          fail=0
          for f in tools/daemon/install.sh tools/daemon/uninstall.sh \
                   tools/helper/install.sh tools/helper/uninstall.sh \
                   tools/daemon/build.sh tools/helper/build.sh \
                   tools/harness/build.sh tools/build-standalone.sh \
                   evidence/diag1.sh evidence/postlogin_check.sh; do
            if sh -n "$f" 2>/dev/null || bash -n "$f"; then
              echo "syntax ok: $f"
            else
              echo "::error::shell 语法错误: $f"; fail=1
            fi
          done
          exit $fail

  privacy:
    name: 隐私检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止提交家目录路径 / 序列号 / 令牌 / 邮箱
        run: |
          set +e
          fail=0
          # 1) 家目录绝对路径（排除说明文档本身）
          git grep -nI -E '/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+' -- \
            ':!PRIVACY.md' ':!CONTRIBUTING.md' ':!.github/' && fail=1
          # 2) 机器序列号
          git grep -nI -E 'C02[A-Z0-9]{5,}' -- ':!.github/' && fail=1
          # 3) 密钥 / 令牌 / 私钥
          git grep -nI -E 'gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY' \
            -- ':!.github/' && fail=1
          # 4) 邮箱地址
          git grep -nI -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- ':!.github/' && fail=1
          if [ "$fail" = "1" ]; then
            echo "::error::发现疑似隐私/密钥内容，请脱敏后再提交（见 PRIVACY.md）"
            exit 1
          fi
          echo "隐私检查通过"
